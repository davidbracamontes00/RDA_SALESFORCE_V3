services:
  api:
    build:
      context: .
    image: rda-gac:local
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      RDA_ENV: production
      RDA_AUTH_ENABLED: "true"
      RDA_REPORTS_DIR: /app/data/reports
    expose:
      - "8000"
    volumes:
      - rda_reportes:/app/data/reports
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${RDA_BIND_ADDRESS:-127.0.0.1}:${RDA_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  rda_reportes:
