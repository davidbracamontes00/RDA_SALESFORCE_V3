services:
  api:
    build:
      context: .
    image: rda-gac:local
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      RDA_ENV: production
      RDA_AUTH_ENABLED: "true"
      RDA_REPORTS_DIR: /app/data/reports
      RDA_ALLOWED_HOSTS: "${RDA_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      RDA_MAX_FILE_MB: "${RDA_MAX_FILE_MB:-25}"
      RDA_MAX_EXPANDED_MB: "${RDA_MAX_EXPANDED_MB:-128}"
      RDA_REPORT_RETENTION_DAYS: "${RDA_REPORT_RETENTION_DAYS:-90}"
    expose:
      - "8000"
    volumes:
      - rda_reportes:/app/data/reports
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 100
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${RDA_BIND_ADDRESS:-127.0.0.1}:${RDA_HTTP_PORT:-8080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 50
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  rda_reportes:
